name: Build Beta APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    # The integration branch has its own pinned native-music build workflow.
    if: github.ref != 'refs/heads/integration/simpmusic' && (github.event_name == 'workflow_dispatch' || endsWith(github.event.head_commit.message, 'workflow build'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: actions/cache@v4
        with:
          path: keystore/debug.keystore
          key: glyphix-beta-debug-signing-v1
      - name: Prepare stable beta signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: bash tools/prepare-beta-signing.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone APK
        run: bash gradlew :app:assembleDebug --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: glyphix-beta-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
