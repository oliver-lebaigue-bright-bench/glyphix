name: Build and launch beta APK
on:
  push:
    branches: ['main', 'fix/startup-and-device-detection']
    paths: ['app/**', 'tests/startup/**', 'tools/**', '*.gradle', 'gradle.properties', '.github/workflows/build-debug-apk.yml']
  pull_request:
    paths: ['app/**', 'tests/startup/**', 'tools/**', '*.gradle', 'gradle.properties', '.github/workflows/build-debug-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Device detection and preference regression checks
        run: bash tests/startup/run.sh
      - uses: actions/cache@v4
        id: beta-key
        with:
          path: keystore/debug.keystore
          key: glyphix-beta-debug-signing-v1
      - name: Prepare retained beta signer
        id: signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: bash tools/prepare-beta-signing.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build main-branch phone app
        run: bash gradlew :app:assembleDebug --build-cache --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch, upgrade, and offline smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tests/startup/launch-smoke.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified beta APK
        uses: actions/upload-artifact@v4
        with:
          name: glyphix-beta-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload launch diagnostics and public signer details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyphix-beta-diagnostics
          path: |
            build/startup-smoke/*
            build/beta-signing/*
          if-no-files-found: ignore
      - name: Preserve beta signer after failed builds
        if: always() && steps.signing.outcome == 'success' && steps.beta-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: keystore/debug.keystore
          key: glyphix-beta-debug-signing-v1
