name: Native SimpMusic integration
on:
  push:
    branches: ['integration/simpmusic']
  pull_request:
    paths:
      - 'app/**'
      - 'simpmusic-integration/**'
      - 'tests/simpmusic/**'
      - '.github/workflows/simpmusic-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simpmusic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare pinned sources and verify patches
        run: python3 simpmusic-integration/prepare.py
      - name: Test PCM conversion
        run: bash tests/simpmusic/run.sh
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: actions/cache@v4
        id: beta-key
        with:
          path: keystore/debug.keystore
          key: glyphix-beta-debug-signing-v1
      - name: Prepare stable beta signing key
        id: signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: bash tools/prepare-beta-signing.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile integrated beta APK
        run: bash .simpmusic-build/gradlew -p .simpmusic-build :glyphix:assembleDebug --no-configuration-cache --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: glyphix-simpmusic-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Lint integrated beta app
        run: |
          status=0
          bash .simpmusic-build/gradlew -p .simpmusic-build :glyphix:lintDebug --no-configuration-cache --build-cache || status=$?
          if [ "$status" -ne 0 ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          fi
          exit "$status"
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyphix-beta-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Preserve beta key even when compilation fails
        if: always() && steps.signing.outcome == 'success' && steps.beta-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: keystore/debug.keystore
          key: glyphix-beta-debug-signing-v1
