plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.glyphix.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'com.glyphix.tv'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-tv-beta.1'
        testInstrumentationRunner 'com.glyphix.tv.GateInstrumentation'
    }
    signingConfigs {
        debug {
            storeFile file('../keystore-tv/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
